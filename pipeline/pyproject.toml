[project]
name = "heirloom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rohit-jsfreaky", email = "rohitkashyapmrt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "huggingface-hub>=2.1.1",
    "openai>=3.23.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "tzdata>=2026.4",
    "wordfreq>=3.1.1",
]

[project.scripts]
heirloom = "heirloom:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
