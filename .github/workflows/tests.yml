name: tests

on:
  push:
  pull_request:

jobs:
  pipeline-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Pipeline unit tests
        working-directory: pipeline
        run: uv run pytest -q
      - name: Re-check every saved result (no dataset in CI, so raw-row checks are skipped)
        working-directory: pipeline
        run: uv run heirloom verify --no-db
      - name: API tests
        working-directory: api
        run: uv run pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the static site from runs/
        working-directory: viewer
        run: |
          npm ci
          npm run lint
          npm run build
